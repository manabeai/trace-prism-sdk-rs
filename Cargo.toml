[package]
name = "traceprism"
version = "0.1.0-preview.3"
edition = "2021"
description = "Record typed algorithm state for the TracePrism local visualizer"
license = "MIT"
repository = "https://github.com/manabeai/trace-prism-sdk-rs"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
